[project]
name = "xingfacad"
version = "0.1.0"
description = "Tu dong hoa mo hinh 3D FreeCAD, ban ve 2D san xuat va bao gia Excel cho cua nhom Xingfa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "ezdxf>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
xfcad = "xingfacad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xingfacad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
